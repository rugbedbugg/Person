name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: mise run check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # mise.toml pins the tool versions (node 22.23.2, python 3.12, uv
      # 0.12.13); this action reads that file, so no version is duplicated
      # here.
      - name: Install mise-pinned toolchain (Node, Python, uv)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # mise.toml's own [tasks.install] and [tasks.check] are the canonical
      # commands; this workflow does not duplicate them.
      - name: Install dependencies
        run: mise run install

      - name: Run the canonical check suite
        run: mise run check
