[project]
name = "person-persistence"
version = "0.1.0"
description = "Person subsystem: person_persistence"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["person-protocol"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/person_persistence"]

[tool.uv.sources]
person-protocol = { workspace = true }
