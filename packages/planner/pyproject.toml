[project]
name = "person-planner"
version = "0.1.0"
description = "Person subsystem: person_planner"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["person-skills"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/person_planner"]

[tool.uv.sources]
person-skills = { workspace = true }
