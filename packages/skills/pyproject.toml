[project]
name = "person-skills"
version = "0.1.0"
description = "Person subsystem: person_skills"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["person-protocol"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/person_skills"]

[tool.hatch.build.targets.wheel.force-include]
"specs" = "person_skills/specs"

[tool.uv.sources]
person-protocol = { workspace = true }
